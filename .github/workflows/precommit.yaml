---
name: precommit

on: [pull_request]

permissions: read-all

jobs:
  precommit:
    # The ubuntu-26.04 leg is a non-blocking canary. The name expression gives
    # the 24.04 leg the plain check name, so required checks match it.
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os == 'ubuntu-26.04' && 'Run pre-commit checks (ubuntu-26.04 canary)' || 'Run pre-commit checks' }}
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip curl unzip
          # tflint
          curl -sSLo ./tflint.zip \
            https://github.com/terraform-linters/tflint/releases/download/v0.60.0/tflint_linux_amd64.zip
          unzip ./tflint.zip
          chmod +x ./tflint
          sudo mv tflint /usr/local/bin/tflint

          # terraform
          curl -sSLo ./terraform.zip \
            https://releases.hashicorp.com/terraform/1.14.4/terraform_1.14.4_linux_amd64.zip
          sudo unzip -o ./terraform.zip -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/terraform

          # terraform-docs
          curl -sSLo ./terraform-docs.tar.gz \
            https://terraform-docs.io/dl/v0.21.0/terraform-docs-v0.21.0-$(uname)-amd64.tar.gz
          tar -xzf ./terraform-docs.tar.gz
          chmod +x ./terraform-docs
          sudo mv ./terraform-docs /usr/local/bin/terraform-docs

          # shfmt
          curl -sSLo ./shfmt \
            https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64
          chmod +x ./shfmt
          sudo mv ./shfmt /usr/local/bin/shfmt

          # conftest
          curl -sSLo ./conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.66.0/conftest_0.66.0_Linux_x86_64.tar.gz
          tar -xzf ./conftest.tar.gz conftest
          chmod +x ./conftest
          sudo mv ./conftest /usr/local/bin/conftest

          # opa
          curl -sSLo ./opa \
            https://github.com/open-policy-agent/opa/releases/download/v1.13.2/opa_linux_amd64_static
          chmod +x ./opa
          sudo mv ./opa /usr/local/bin/opa

          pip install pre-commit
          pip install checkov==3.2.500


      - name: pre-commit run
        env:
          # tflint --init fetches ruleset plugins from the GitHub API. Without
          # a token it shares the anonymous rate limit of the runner's IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # this path is needed for pre-commit
          export PATH="~/.local/bin:$PATH"

          tflint --init --config .tflint.hcl
          pre-commit run \
            --show-diff-on-failure \
            --from-ref origin/${GITHUB_BASE_REF} \
            --to-ref HEAD

      # pre-commit above checks only the files this PR changed, so a policy
      # change or a rego test can pass here while the rest of the tree fails it.
      - name: Policy checks on the whole tree
        run: |
          conftest verify --policy conftest-policies/ --no-color
          git ls-files -z 'examples/*.tf' 'modules/*.tf' \
            | xargs -0 conftest test --parser hcl2 --policy conftest-policies/ --no-color
