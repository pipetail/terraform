---
name: terraform-lock

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - "**/versions.tf"
      - "**/.terraform.lock.hcl"
      - "renovate.json"

jobs:
  terraform-lock:
    runs-on: ubuntu-latest
    name: Verify Terraform lock files
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Update lock files
        run: |
          LOCK_PLATFORMS="-platform=windows_amd64 -platform=darwin_amd64 -platform=linux_amd64 -platform=darwin_arm64 -platform=linux_arm64"

          # Find all directories containing .terraform.lock.hcl
          for lockfile in $(find . -name ".terraform.lock.hcl" -type f | sort); do
            dir=$(dirname "$lockfile")
            echo "Updating lock file in $dir"
            cd "$dir"
            terraform init -backend=false -upgrade
            terraform providers lock $LOCK_PLATFORMS
            cd - > /dev/null
          done

      - name: Verify lock files
        run: |
          if ! git diff --quiet -- '**/.terraform.lock.hcl'; then
            git diff -- '**/.terraform.lock.hcl'
            echo "::error::Terraform lock files are stale. Regenerate them for all five required platforms and commit the changes."
            exit 1
          fi
