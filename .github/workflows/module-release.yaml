---
name: module-release

permissions:
  contents: write

# Runs on its own script and workflow too, so the merge that adds it seeds
# every module that has no tag yet at v1.0.0.
on:
  push:
    branches:
      - master
    paths:
      - 'modules/**'
      - '.github/scripts/module-release.mjs'
      - '.github/workflows/module-release.yaml'

concurrency:
  group: module-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    name: Tag changed modules
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags and the full range since the previous push

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Create module releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: node .github/scripts/module-release.mjs release
