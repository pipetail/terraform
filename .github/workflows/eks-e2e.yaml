---
name: eks-e2e

permissions:
  id-token: write # for fetching the OIDC token
  contents: read  # for actions/checkout

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      destroy_only:
        description: Skip apply and the node check, only destroy what an earlier run left behind
        type: boolean
        default: false

concurrency:
  group: eks-e2e
  cancel-in-progress: false

env:
  EXAMPLE: examples/07-aws-eks

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: 07-aws-eks - apply, check, destroy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          role-session-name: GithubActionsEksE2e
          aws-region: eu-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: v1.16.4
          terraform_wrapper: false

      - name: terraform init
        id: init
        run: terraform -chdir="$EXAMPLE" init -input=false

      # Step timeouts, not a job timeout: a job timeout would also cut off
      # the destroy below and leave a cluster running.
      - name: terraform apply
        if: ${{ !inputs.destroy_only }}
        timeout-minutes: 40
        run: terraform -chdir="$EXAMPLE" apply -input=false -auto-approve

      - name: Wait for Ready nodes
        if: ${{ !inputs.destroy_only }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$(terraform -chdir="$EXAMPLE" output -raw cluster_name)"
          until [ "$(kubectl get nodes --no-headers 2>/dev/null | wc -l)" -ge 1 ]; do
            sleep 15
          done
          kubectl wait --for=condition=Ready nodes --all --timeout=10m
          kubectl get nodes -o wide

      # A step that hits its timeout is killed without releasing the S3 state
      # lock, so destroy has to ignore it. Safe only because the eks-e2e
      # concurrency group lets one run use this state key at a time.
      - name: terraform destroy
        if: always() && steps.init.outcome == 'success'
        timeout-minutes: 40
        run: terraform -chdir="$EXAMPLE" destroy -input=false -auto-approve -lock=false

      # KMS keys stay listed while pending deletion, which is expected.
      # The tagging API keeps listing other resources for a while after they
      # are deleted, so each ARN it returns is confirmed with a describe call.
      - name: Check for leftovers
        if: always() && steps.init.outcome == 'success'
        run: |
          set -euo pipefail
          candidates() {
            aws resourcegroupstaggingapi get-resources \
              --tag-filters Key=example,Values=07-aws-eks \
              --query 'ResourceTagMappingList[].ResourceARN' --output text \
              | tr '\t' '\n' | grep -v -e ':kms:' -e '^$' || true
          }
          # A NAT gateway prints its state, which still_exists checks for deleted.
          describe() {
            local service="$1" resource="$2" id="${2#*/}"
            case "$service:$resource" in
              ec2:natgateway/*)
                aws ec2 describe-nat-gateways --nat-gateway-ids "$id" --query 'NatGateways[0].State' --output text ;;
              ec2:subnet/*) aws ec2 describe-subnets --subnet-ids "$id" ;;
              ec2:security-group/*) aws ec2 describe-security-groups --group-ids "$id" ;;
              ec2:vpc/*) aws ec2 describe-vpcs --vpc-ids "$id" ;;
              ec2:route-table/*) aws ec2 describe-route-tables --route-table-ids "$id" ;;
              ec2:network-acl/*) aws ec2 describe-network-acls --network-acl-ids "$id" ;;
              ec2:internet-gateway/*) aws ec2 describe-internet-gateways --internet-gateway-ids "$id" ;;
              ec2:elastic-ip/*) aws ec2 describe-addresses --allocation-ids "$id" ;;
              eks:cluster/*) aws eks describe-cluster --name "$id" ;;
              eks:nodegroup/*/*/*)
                local cluster="${id%%/*}" nodegroup="${id#*/}"
                aws eks describe-nodegroup --cluster-name "$cluster" --nodegroup-name "${nodegroup%%/*}" ;;
              logs:log-group:*)
                local name="${resource#log-group:}" groups
                name="${name%:\*}"
                groups="$(aws logs describe-log-groups --log-group-name-prefix "$name" \
                  --query 'logGroups[].logGroupName' --output text)" || return 1
                if ! tr '\t' '\n' <<< "$groups" | grep -Fxq -- "$name"; then
                  echo "log group NotFound"
                  return 1
                fi
                echo "$name" ;;
              *)
                echo "no describe call for this ARN type" >&2
                return 1 ;;
            esac
          }
          # Unknown ARN types and describe errors other than NotFound count
          # as existing, so the check fails rather than miss a leftover.
          still_exists() {
            local arn="$1" service resource out
            service="$(cut -d: -f3 <<< "$arn")"
            resource="$(cut -d: -f6- <<< "$arn")"
            if ! out="$(describe "$service" "$resource" 2>&1 < /dev/null)"; then
              case "$out" in
                *NotFound*) return 1 ;;
              esac
              echo "$arn: $out" >&2
              return 0
            fi
            case "$out" in
              deleted | deleting) return 1 ;;
              *) return 0 ;;
            esac
          }
          leftovers() {
            local arn
            candidates | while IFS= read -r arn; do
              if still_exists "$arn"; then
                echo "$arn"
              fi
            done
          }
          left="$(leftovers)"
          if [ -n "$left" ]; then
            sleep 120
            left="$(leftovers)"
          fi
          if [ -n "$left" ]; then
            echo "::error::resources tagged example=07-aws-eks still exist after destroy:"
            echo "$left"
            exit 1
          fi
