---
name: terraform-apply-05-aws-complete

permissions:
  id-token: write      # for fetching the OIDC token
  contents: read       # for actions/checkout
  pull-requests: write # For dflook comments on PR

on:
  workflow_dispatch:
    inputs:
      auto_approve:
        description: Auto approve Terraform apply
        required: false
        default: 'true'
  push:
    branches:
      - "master"
    paths:
      - "examples/05-aws-complete/**"
      - "modules/**"
      - ".github/workflows/**"

jobs:
  tf-apply:
    runs-on: ubuntu-latest
    name: 05-aws-complete - apply approved terraform plan
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          role-session-name: GithubActionsTerraform
          aws-region: eu-west-1

      - name: Terraform apply
        uses: dflook/terraform-apply@9fdc48d2744ee0528495a136ad2cd31ad8208a67 # v3
        with:
          path: examples/05-aws-complete
          auto_approve: ${{ github.event.inputs.auto_approve || 'false' }}

      - name: Terraform destroy
        uses: dflook/terraform-destroy@90d912c5ee23843ead86960fb485ffa0e69b8537 # v3
        with:
          path: examples/05-aws-complete
