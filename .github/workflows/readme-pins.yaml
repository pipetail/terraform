name: readme-pins

permissions:
  contents: read

on:
  pull_request:

jobs:
  readme-pins:
    runs-on: ubuntu-latest
    name: Check README version pins
    timeout-minutes: 5
    steps:
      # The script reads the release tags, and a shallow checkout has none.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Rewrite the pins from the newest release tags
        run: git tag --list | node .github/scripts/readme-pins.mjs

      - name: Fail when a committed README has a stale pin
        run: |
          if ! git diff --exit-code -- README.md 'modules/*/README.md'; then
            echo "::error::A README pins an old module version. Run 'git fetch --tags && git tag --list | node .github/scripts/readme-pins.mjs' and commit the result."
            exit 1
          fi
