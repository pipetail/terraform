---
name: Package Lambda Functions

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'src/*/*.mjs'
      - 'src/*/*.js'
      - 'src/*/package.json'
      - 'src/*/package-lock.json'
      - 'scripts/package-lambdas.sh'

jobs:
  package:
    runs-on: ubuntu-latest
    name: Package Lambda Functions
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Verify package versions
        working-directory: src/aws-events-to-slack
        run: |
          node --input-type=commonjs <<'NODE'
          const pkg = require("./package.json");
          const lock = require("./package-lock.json");
          const lockVersions = [lock.version, lock.packages?.[""]?.version];
          const versionsMatch =
            typeof pkg.version === "string" &&
            lockVersions.every((version) => version === pkg.version);

          if (!versionsMatch) {
            console.error(
              `::error::package.json version ${pkg.version} must match package-lock.json versions ${lockVersions.join(", ")}`,
            );
            process.exit(1);
          }

          console.log(`Package versions match: ${pkg.version}`);
          NODE

      - name: Detect changed lambdas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            packaging-script:
              - 'scripts/package-lambdas.sh'
            src:
              - 'src/**'

      - name: Determine lambdas to package
        id: lambdas
        env:
          # Branch names may contain shell metacharacters, so this is read as
          # data rather than pasted into the script body.
          BASE_REF: ${{ github.base_ref }}
          SCRIPT_CHANGED: ${{ steps.changes.outputs.packaging-script }}
        run: |
          if [ "$SCRIPT_CHANGED" == "true" ]; then
            echo "Package all lambdas (packaging script changed)"
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            CHANGED=""
            for dir in src/*/; do
              lambda_name=$(basename "$dir")
              if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -q "^src/${lambda_name}/"; then
                CHANGED="$CHANGED $lambda_name"
              fi
            done
            echo "args=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Lambda functions
        if: steps.changes.outputs.src == 'true' || steps.changes.outputs.packaging-script == 'true'
        env:
          # Built from basename of directories under src/, which a PR controls.
          LAMBDA_ARGS: ${{ steps.lambdas.outputs.args }}
        run: |
          chmod +x scripts/package-lambdas.sh
          # Deliberately unquoted: this is a space-separated list of lambda
          # names and word splitting is the intent.
          # shellcheck disable=SC2086
          ./scripts/package-lambdas.sh ${LAMBDA_ARGS}

      # Packages are published as GitHub release assets (see lambda-release.yaml),
      # not committed to the repo. This step only verifies that the source packages
      # cleanly and uploads the result as a CI artifact for inspection.
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.changes.outputs.src == 'true' || steps.changes.outputs.packaging-script == 'true'
        with:
          name: lambda-packages
          path: src/*.zip
          if-no-files-found: ignore
