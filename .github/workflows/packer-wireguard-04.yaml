---
name: packer-wireguard-04

# Without this the workflow inherits the repository default, which grants far
# more than either job uses. Each job narrows or widens from here explicitly.
permissions:
  contents: read

on:
  push:
    branches:
      - master
    paths:
      - 'examples/04-aws-wireguard-vpn/packer/**'
  pull_request:
    branches:
      - master
    paths:
      - 'examples/04-aws-wireguard-vpn/packer/**'
  workflow_dispatch:

concurrency:
  group: packer-wireguard-04-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Validate Packer

    # No cloud credentials here on purpose. This job runs on pull_request, and
    # `packer init` installs plugin binaries named in the PR's own template, so
    # holding a role would let a PR run arbitrary code against the account.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3

      - name: Packer Init
        working-directory: examples/04-aws-wireguard-vpn/packer
        run: packer init wireguard.pkr.hcl

      # -syntax-only because this job holds no AWS credentials. A plain
      # `packer validate` still prepares the provisioner blocks, and the shell
      # provisioner interpolates the amazon-secretsmanager datasource into
      # environment_vars — unevaluated that is <unknown>, which is not a
      # key=value pair, so validation fails on valid templates. Builder and
      # provisioner config is therefore only checked by the master build.
      - name: Packer Validate
        working-directory: examples/04-aws-wireguard-vpn/packer
        run: packer validate -syntax-only -var-file=wireguard-prod.pkvars.hcl wireguard.pkr.hcl

  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # A called workflow cannot be granted more than its caller holds, so the
    # OIDC token the build needs has to be granted here.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/packer-build.yaml
    with:
      name: wireguard-04
      packer_directory: examples/04-aws-wireguard-vpn/packer
      pkvars_file: wireguard-prod.pkvars.hcl
      pkr_file: wireguard.pkr.hcl
      aws_region: eu-west-1
    secrets:
      OIDC_ROLE_ARN: ${{ secrets.OIDC_ROLE_ARN }}
