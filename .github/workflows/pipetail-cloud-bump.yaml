---
name: pipetail-cloud-bump

permissions:
  contents: read

# pipetail/pipetail-cloud pins pipetail-cloud-role and pipetail-cloud-health-ingest by tag, partly
# inside TypeScript strings and JSON. Dependabot can neither read a prefixed tag nor edit those
# files, so each release workflow calls this one to open the bump PR over there.
on:
  workflow_call:
    inputs:
      module:
        type: string
        required: true
      version:
        type: string
        required: true
    secrets:
      token:
        description: Can push branches and open PRs in pipetail/pipetail-cloud
        required: false

jobs:
  bump:
    # The token reaches pipetail-cloud, so it only ever runs for a release from the default branch.
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    name: Open bump PR in pipetail-cloud
    timeout-minutes: 10
    concurrency:
      group: pipetail-cloud-bump-${{ inputs.module }}
      cancel-in-progress: false
    env:
      TARGET_REPO: pipetail/pipetail-cloud
      MODULE: ${{ inputs.module }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.module }}-v${{ inputs.version }}
      BRANCH: loop/bump-${{ inputs.module }}-${{ inputs.version }}
    steps:
      - name: Require the token
        env:
          TOKEN: ${{ secrets.token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The PIPETAIL_CLOUD_BUMP_TOKEN secret is not set, so ${TAG} was released but no bump PR was opened in ${TARGET_REPO}."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          path: terraform

      - name: Checkout pipetail-cloud
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pipetail/pipetail-cloud
          token: ${{ secrets.token }}
          path: pipetail-cloud

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Push the bump branch
        id: push
        working-directory: pipetail-cloud
        run: |
          set -euo pipefail
          bump() { node ../terraform/.github/scripts/pipetail-cloud-bump.mjs "$MODULE" "$VERSION" . > "$RUNNER_TEMP/changed"; }

          bump
          if [ ! -s "$RUNNER_TEMP/changed" ]; then
            echo "::notice::Every pin in ${TARGET_REPO} is already at ${TAG} or newer; no PR needed."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

          # An earlier run for this version already pushed the branch: build on it, never rewrite it.
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" > /dev/null; then
            git reset --hard --quiet
            git fetch --quiet --depth=1 origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git checkout --quiet -B "$BRANCH" "origin/${BRANCH}"
            bump
          else
            git checkout --quiet -b "$BRANCH"
          fi

          if [ ! -s "$RUNNER_TEMP/changed" ]; then
            echo "::notice::${BRANCH} already pins ${TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add --pathspec-from-file="$RUNNER_TEMP/changed" --pathspec-file-nul
          git commit --quiet -m "chore(deps): bump ${MODULE} to v${VERSION}"
          git push --quiet origin "HEAD:refs/heads/${BRANCH}"

      - name: Open the PR
        if: steps.push.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.token }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.module }}-v${{ inputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          EXISTING="$(gh pr list --repo "$TARGET_REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // ""')"
          if [ -n "$EXISTING" ]; then
            echo "::notice::Updated ${EXISTING}"
            exit 0
          fi
          BODY="$(printf '%s\n\n%s\n' \
            "${GITHUB_REPOSITORY} released ${MODULE} v${VERSION}: ${RELEASE_URL}" \
            "This PR moves every pin of the module to ${TAG}. Opened by ${RUN_URL}")"
          gh pr create --repo "$TARGET_REPO" --base "$(gh repo view "$TARGET_REPO" --json defaultBranchRef --jq .defaultBranchRef.name)" \
            --head "$BRANCH" --title "chore(deps): bump ${MODULE} to v${VERSION}" --body "$BODY"
